admin_article:
    path: /admin/article/index
    controller: App\Controllers\Article\Article:index

admin_article_list:
    path: /admin/article/list
    controller: App\Controllers\Article\Article:list

admin_article_create:
    path: /admin/article/new
    controller: App\Controllers\Article\Article:new

admin_article_modify:
    path: "/admin/article/edit/{id<\\d+>}"
    controller: App\Controllers\Article\Article:edit
    method: [GET]

admin_article_design:
    path: /admin/article/design
    controller: App\Controllers\Article\Article:design
admin_article_destroy:
    path: /admin/article/delete
    controller: App\Controllers\Article\Article:delete