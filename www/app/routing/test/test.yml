test_success:
  path: "/test/success"
  method: [GET]
  controller: App\Controllers\Test:success

test_page_not_found:
  path: "/test/view"
  method: [GET]
  controller: App\Controllers\Test:viewNotFound

test_forbidden:
  path: "/test/forbidden"
  method: [GET]
  controller: App\Controllers\Test:forbidden

test_invalid_method:
  path: "/test/method"
  method: [POST]
  controller: App\Controllers\Test:invalidMethod

test_param_not_found:
  path: "/test/param/{id<\\d+>}"
  method: [GET]
  controller: App\Controllers\Test:paramNotFound
