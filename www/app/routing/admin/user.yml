admin_user_list:
  path: "/admin/user/list"
  controller: App\Controllers\Admin\User:indexUser




admin_user_new:
  path: "admin/user/new"
  controller: App\Controllers\Admin\User:newUser
  method: [GET, POST]




admin_user_edit:
  path: "admin/user/edit/{id}"
  controller: App\Controllers\Admin\User:editUser
  method: [GET, POST]




admin_user_delete:
  path: "admin/user/delete/{id}"
  controller: App\Controllers\Admin\User:deleteUser
  method: [GET]








