app_catalogue:
  path: "/cours"
  controller: App\Controllers\Cours:index
  method: [GET]

app_catalogue_show:
  path: "/cours/{id}"
  controller: App\Controllers\Cours:show
  method: [GET]
  entity: Lesson

app_cours_management:
  path: "/cours/{id}/management"
  controller: App\Controllers\Cours:management
  method: [POST]

app_catalogue_notate:
  path: "/cours/{id}/notation"
  controller: App\Controllers\Cours:notation
  method: [GET]
  roles: ["ROLE_USER", "ROLE_ADMIN"]