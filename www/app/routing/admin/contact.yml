admin_contact_list:
  path: /admin/contact
  controller: App\Controllers\Admin\Contact:index
  roles: ["ROLE_ADMIN"]

admin_contact_new:
  path: /admin/contact/new
  controller: App\Controllers\Admin\Contact:new
  roles: ["ROLE_ADMIN"]
  method: [GET,POST]

admin_contact_edit:
  path: /admin/contact/edit/{id}
  controller: App\Controllers\Admin\Contact:edit
  roles: ["ROLE_ADMIN"]
  method: [GET,POST]

admin_contact_delete:
  path: /admin/contact/delete/{id}
  controller: App\Controllers\Admin\Contact:delete
  roles: ["ROLE_ADMIN"]
  method: [GET]