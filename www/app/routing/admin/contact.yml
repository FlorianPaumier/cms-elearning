admin_contact_index:
  path: /admin/contact
  controller: App\Controllers\Admin\Contact:index
  method: [GET]
admin_contact_new:
  path: /admin/contact/new
  controller: App\Controllers\Admin\Contact:new
  method: [GET, POST]
admin_contact_edit:
  path: /admin/contact/edit/{id<\d+>}
  controller: App\Controllers\Admin\Contact:edit
  method: [GET,POST]
admin_contact_delete:
  path: /admin/contact/delete/{id<\d+>}
  controller: App\Controllers\Admin\Contact:delete
  method: [DELETE]