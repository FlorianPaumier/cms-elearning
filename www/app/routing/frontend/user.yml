app_user_login:
  path: '/login'
  controller: App\Controllers\Users\User:login
  method: [GET]

app_user_register:
  path: "/register"
  controller: App\Controllers\Users\User:register
  method: [GET, POST]

app_user_login_check:
  path: "/login-check"
  controller: App\Controllers\Users\User:loginCheck
  method: [POST]

app_user_logout:
  path: "/logout"
  controller: App\Controllers\Users\User:logout
  method: [GET]
  roles: ["ROLE_USER", "ROLE_ADMIN"]

app_user_forget_password:
  path: "/forget_password"
  controller: App\Controllers\Users\User:forgetPassword
  method: [GET, POST]

app_user_delete_user:
  path: "/user/delete"
  controller: App\Controllers\Users\User:deleteUser
  method: [GET, POST]
  roles: ["ROLE_USER", "ROLE_ADMIN"]

app_user_profile:
  path: "/me"
  controller: App\Controllers\Users\User:profile
  method: [GET]
  roles: [ROLE_USER]

app_user_lessons:
  path: "/me/lessons"
  controller: App\Controllers\Users\User:lessons
  method: [GET]
  roles: [ROLE_USER]

app_user_parameters :
  path: "/me/parameters"
  controller: App\Controllers\Users\User:edit
  method: [GET, POST]
  roles: [ROLE_USER]

app_user_confirmation :
  path: "/confirmation"
  controller: App\Controllers\Users\User:confirmationAccount
  method: [GET, POST]








