admin_category:
  path: /admin/category
  controller: App\Controllers\Admin\Category:index

admin_category_index:
  path: /admin/category/index
  controller: App\Controllers\Admin\Category:index

admin_category_new:
  path: /admin/category/new
  controller: App\Controllers\Admin\Category:new

admin_category_edit:
  path: /admin/category/edit/{id}
  controller: App\Controllers\Admin\Category:edit
  method: [GET]

admin_category_delete:
  path: /admin/category/delete/{id}
  controller: App\Controllers\Admin\Category:delete
  method: [GET]