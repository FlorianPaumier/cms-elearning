app_user_login:
  path: '/login'
  controller: App\Controllers\Users\User:login
  method: [GET]

app_user_register:
  path: "/register"
  controller: App\Controllers\Users\User:register
  method: [GET, POST]

app_user_login_check:
  path: "/login-check"
  controller: App\Controllers\Users\User:loginCheck
  method: [POST]

app_user_logout:
  path: "/user-logout"
  controller: App\Controllers\Users\User:logout
  method: [GET]








