frontend_sondage_list:
  path: /sondage
  controller: App\Controllers\Sondage:index

frontend_sondage_show:
  path: /sondage/show/{id<\\d+>}
  controller: App\Controllers\Sondage:show
  method: [GET,POST]

frontend_sondage_vote:
  path: /sondage/vote
  controller: App\Controllers\Sondage:vote
  method: [GET,POST]